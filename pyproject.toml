[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfqdiff"
version = "0.2.0"
description = "Transparent supplier quotation comparison for structured procurement decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiğitcan Öztürk" }]
keywords = ["procurement", "rfq", "quotations", "supplier-management", "decision-support", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/yigitcan-ozturk/rfqdiff"
Repository = "https://github.com/yigitcan-ozturk/rfqdiff"
Issues = "https://github.com/yigitcan-ozturk/rfqdiff/issues"

[project.scripts]
rfqdiff = "rfqdiff.cli:main"

[tool.setuptools]
packages = ["rfqdiff"]
py-modules = ["main"]
